[alembic]
script_location = migrations
prepend_sys_path = .
# WARNING: Hardcoded credentials in source control!
# Set via env var `DATABASE_URL` at runtime to override:
sqlalchemy.url = ${DATABASE_URL:-postgresql+psycopg://andijan:andijan@postgres:5432/maydoncha}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
