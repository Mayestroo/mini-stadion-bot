name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/sportly_deploy_key
          chmod 600 ~/.ssh/sportly_deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/sportly_deploy_key -p "${VPS_PORT:-22}" "${VPS_USER:-root}@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd /srv/sportly
          git fetch origin main
          git reset --hard origin/main

          docker compose -p sportly -f docker-compose.prod.yml build
          docker compose -p sportly -f docker-compose.prod.yml up -d

          # Wait for containers to become healthy
          echo "Waiting for services to start..."

          # Copy nginx config and reload
          cp /srv/sportly/deploy/nginx-pentestlab.conf /srv/ielts/deploy/vps/nginx/conf.d/sportly-pentestlab.conf
          docker exec ielts-nginx nginx -t
          docker exec ielts-nginx nginx -s reload

          # Health check with retries (up to 60 seconds per endpoint)
          for url in https://api.pentestlab.uz https://pentestlab.uz/miniapp; do
            echo "Checking $url ..."
            for i in $(seq 1 12); do
              if curl -fsS --max-time 5 "$url" >/dev/null 2>&1; then
                echo "  ✓ $url is up"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "  ✗ $url failed after 60s"
                docker compose -p sportly -f docker-compose.prod.yml logs --tail=50
                exit 1
              fi
              echo "  attempt $i/12 failed, retrying in 5s..."
              sleep 5
            done
          done

          docker compose -p sportly -f docker-compose.prod.yml ps
          REMOTE
