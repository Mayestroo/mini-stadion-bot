services:
  postgres:
    image: postgres:16-alpine
    container_name: sportly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportly}
      POSTGRES_USER: ${POSTGRES_USER:-sportly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - sportly_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportly} -d ${POSTGRES_DB:-sportly}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      sportly_internal:
        aliases:
          - sportly_postgres
          - postgres

  backend:
    build: ./backend
    container_name: sportly_backend
    restart: unless-stopped
    command: sh -c "python -c 'from app.core.database import Base, engine; from app import models; Base.metadata.create_all(bind=engine)' && alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    volumes:
      - sportly_uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      sportly_internal:
      ielts_proxy:
        aliases:
          - sportly_backend

  worker:
    build: ./backend
    container_name: sportly_worker
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - sportly_uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/app/worker.py') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - sportly_internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: sportly_frontend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      ielts_proxy:
        aliases:
          - sportly_frontend

networks:
  sportly_internal:
    name: sportly_internal
    driver: bridge
  ielts_proxy:
    external: true
    name: ielts-prod_internal

volumes:
  sportly_pg_data:
  sportly_uploads:
