services:
  postgres:
    image: postgres:16-alpine
    container_name: andijonarena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andijan_futbol}
      POSTGRES_USER: ${POSTGRES_USER:-andijan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - andijonarena_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andijan} -d ${POSTGRES_DB:-andijan_futbol}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - andijonarena_internal

  backend:
    build: ./backend
    container_name: andijonarena_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    volumes:
      - andijonarena_uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      andijonarena_internal:
      ielts_proxy:
        aliases:
          - andijonarena_backend

  worker:
    build: ./backend
    container_name: andijonarena_worker
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - andijonarena_uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - andijonarena_internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: andijonarena_frontend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      ielts_proxy:
        aliases:
          - andijonarena_frontend

networks:
  andijonarena_internal:
    name: andijonarena_internal
    driver: bridge
  ielts_proxy:
    external: true
    name: ielts-prod_internal

volumes:
  andijonarena_pg_data:
  andijonarena_uploads:
