services:
  postgres:
    image: postgres:16-alpine
    container_name: andijan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-andijan_futbol}
      POSTGRES_USER: ${POSTGRES_USER:-andijan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andijan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-andijan} -d ${POSTGRES_DB:-andijan_futbol}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - andijan_net

  backend:
    build: ./backend
    container_name: andijan_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - andijan_net

  worker:
    build: ./backend
    container_name: andijan_worker
    restart: unless-stopped
    command: python -m app.worker
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - andijan_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    container_name: andijan_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - andijan_net


networks:
  andijan_net:
    driver: bridge

volumes:
  postgres_data:
